name: Public release quality gates

on:
  workflow_call:
    inputs:
      release_tag:
        description: Optional release tag that must match the package version
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  EXPECTED_RELEASE_TAG: v0.1.3
  DISTRIBUTION_ARTIFACT: python-package-distributions-${{ github.sha }}
  PROVENANCE_ARTIFACT: python-package-provenance-${{ github.sha }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Ruff correctness checks
        run: python -m ruff check src tests ci
      - name: Enforce pure-decision complexity ceilings
        run: |
          python -m ruff check \
            src/supernote_module_generator/generation_plan.py \
            src/supernote_module_generator/arguments.py \
            src/supernote_module_generator/integrity_manifest.py \
            src/supernote_module_generator/semantic_types.py \
            src/supernote_module_generator/cpp_lexer.py \
            src/supernote_module_generator/cpp_declarations.py \
            src/supernote_module_generator/cpp_members.py \
            src/supernote_module_generator/cpp_member_semantics.py \
            src/supernote_module_generator/cpp_member_shapes.py \
            src/supernote_module_generator/cpp_class_syntax.py \
            src/supernote_module_generator/cpp_function_syntax.py \
            src/supernote_module_generator/cpp_global_functions.py \
            src/supernote_module_generator/cpp_source_routing.py \
            src/supernote_module_generator/jsi_binding_decisions.py \
            src/supernote_module_generator/cpp_type_syntax.py \
            src/supernote_module_generator/binding_codegen.py \
            src/supernote_module_generator/windows_authority.py \
            ci/release_asset_preflight.py \
            ci/release_provenance.py \
            --select C901
      - name: Ratchet filesystem safety-boundary complexity
        run: python ci/check_filesystem_complexity.py
      - name: Ratchet generation orchestration complexity
        run: python ci/check_transaction_complexity.py
      - name: Run gradual public boundary typing checks
        run: python -m mypy
      - name: Compile every Python source and test module
        run: python -m compileall -q src tests ci
      - name: Run tests
        run: python -m pytest -q

  coverage-linux:
    name: Complete Linux branch coverage input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install coverage dependencies
        run: python -m pip install -e '.[dev]'
      - name: Measure complete-suite branch coverage
        run: >-
          python -m coverage run
          --data-file=.coverage.linux-complete
          -m pytest -q
      - name: Retain complete-suite coverage input
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux-complete
          path: .coverage.linux-complete
          include-hidden-files: true

  platform:
    name: Platform boundaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install platform qualification dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile source on the native platform
        run: python -m compileall -q src tests ci
      - name: Qualify paths locks subprocesses and symlink policy
        run: >-
          python -m coverage run
          --data-file=.coverage.platform-${{ runner.os }}
          -m pytest -q
          tests/test_platform_tools.py
          tests/test_operation_lock.py
          tests/test_regression_harness.py
          tests/test_platform_paths.py
          tests/test_devconfig.py
          tests/test_packaging.py::test_clean_wheel_installs_only_the_public_console_script
      - name: Retain native-platform coverage input
        uses: actions/upload-artifact@v4
        with:
          name: coverage-platform-${{ runner.os }}
          path: .coverage.platform-${{ runner.os }}
          include-hidden-files: true

  coverage:
    name: Combined native-platform branch coverage
    needs: [coverage-linux, platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install coverage dependencies
        run: python -m pip install -e '.[dev]'
      - name: Download exact-SHA native coverage inputs
        uses: actions/download-artifact@v5
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Combine and enforce the checked-in coverage floor
        run: |
          python -m coverage combine coverage-data
          python -m coverage report

  package:
    name: Build and install package
    needs: [test, coverage, platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release tools
        run: python -m pip install -r ci/release-requirements.txt
      - name: Verify release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="$(PYTHONPATH=src python -c 'from supernote_module_generator import __version__; print(__version__)')"
          test "$RELEASE_TAG" = "$EXPECTED_RELEASE_TAG" || {
            echo "Release tag ${RELEASE_TAG} is not the approved stable tag ${EXPECTED_RELEASE_TAG}." >&2
            exit 1
          }
          test "$RELEASE_TAG" = "v${version}" || {
            echo "Release tag ${RELEASE_TAG} does not match package version v${version}." >&2
            exit 1
          }
      - name: Build byte-reproducible wheel and source distribution twice
        run: >-
          python ci/reproducible_release_build.py
          --source .
          --output dist
          --commit "$GITHUB_SHA"
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Record exact release provenance
        run: >-
          python ci/release_provenance.py record
          dist
          "${{ runner.temp }}/release-provenance"
          --repository "$GITHUB_REPOSITORY"
          --commit "$GITHUB_SHA"
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/sn-module-gen" --version
          "$RUNNER_TEMP/wheel-smoke/bin/sn-module-gen" --help
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c \
            'import json; from importlib.resources import files; json.loads(files("supernote_module_generator").joinpath("schemas/command-result.schema.json").read_text(encoding="utf-8"))'
      - name: Install and smoke the source distribution
        run: |
          mkdir -p "$RUNNER_TEMP/sdist-smoke"
          python -m pip install --no-deps --no-build-isolation \
            --target "$RUNNER_TEMP/sdist-smoke" dist/*.tar.gz
          PYTHONPATH="$RUNNER_TEMP/sdist-smoke" \
            python -m supernote_module_generator.cli --version
          PYTHONPATH="$RUNNER_TEMP/sdist-smoke" \
            python -m supernote_module_generator.cli --help >/dev/null
      - name: Rebuild the canonical wheel from the source distribution
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sdist-source" "$RUNNER_TEMP/sdist-wheel"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist-source"
          source_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          SOURCE_DATE_EPOCH="$source_epoch" python -m build \
            --wheel --no-isolation \
            --outdir "$RUNNER_TEMP/sdist-wheel" \
            "$RUNNER_TEMP/sdist-source/sn_module_gen-0.1.3"
          cmp dist/*.whl "$RUNNER_TEMP/sdist-wheel"/*.whl
          python -m venv "$RUNNER_TEMP/sdist-wheel-smoke"
          "$RUNNER_TEMP/sdist-wheel-smoke/bin/python" -m pip install \
            --no-deps "$RUNNER_TEMP/sdist-wheel"/*.whl
          "$RUNNER_TEMP/sdist-wheel-smoke/bin/sn-module-gen" --version
          "$RUNNER_TEMP/sdist-wheel-smoke/bin/sn-module-gen" --help >/dev/null
      - name: Store exact-commit release distributions
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DISTRIBUTION_ARTIFACT }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
      - name: Store exact-commit release provenance
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROVENANCE_ARTIFACT }}
          path: ${{ runner.temp }}/release-provenance/
          if-no-files-found: error
          retention-days: 7

  package-minimum:
    name: Minimum build tools and sdist-derived wheel
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.DISTRIBUTION_ARTIFACT }}
          path: dist
      - name: Build and install with the declared minimum backend
        run: |
          python -m pip install setuptools==58.0.4 wheel==0.37.0
          python -m pip wheel --no-deps --no-build-isolation \
            --wheel-dir "$RUNNER_TEMP/minimum-wheel" dist/*.tar.gz
          python -m venv "$RUNNER_TEMP/minimum-smoke"
          "$RUNNER_TEMP/minimum-smoke/bin/python" -m pip install \
            --no-deps "$RUNNER_TEMP/minimum-wheel"/*.whl
          "$RUNNER_TEMP/minimum-smoke/bin/sn-module-gen" --version
          "$RUNNER_TEMP/minimum-smoke/bin/sn-module-gen" --help >/dev/null

  generator-qualification:
    name: Installed generator (${{ matrix.os }}, CMake ${{ matrix.cmake }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cmake: ["3.24.3", current]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.DISTRIBUTION_ARTIFACT }}
          path: dist
      - name: Install source-test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Select the minimum CMake
        if: matrix.cmake == '3.24.3'
        run: python -m pip install cmake==3.24.3
      - name: Select and verify the required native toolchain
        shell: bash
        run: >-
          python ci/verify_command_result.py installed-select-toolchain
          --github-env="$GITHUB_ENV"
          --evidence="${{ runner.temp }}/generator-toolchain.json"
      - name: Prepare exact installed-artifact identity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import subprocess

          root = Path.cwd()
          wheel = next((root / "dist").glob("*.whl")).resolve()
          sdist = next((root / "dist").glob("*.tar.gz")).resolve()
          venv = Path(os.environ["RUNNER_TEMP"]) / "generator-wheel"
          subprocess.run(("python", "-m", "venv", str(venv)), check=True)
          scripts = venv / ("Scripts" if os.name == "nt" else "bin")
          python = scripts / ("python.exe" if os.name == "nt" else "python")
          command = scripts / ("sn-module-gen.exe" if os.name == "nt" else "sn-module-gen")
          subprocess.run((str(python), "-m", "pip", "install", "--no-deps", str(wheel)), check=True)
          values = {
              "SUPERNOTE_MODULE_COMMAND": command,
              "SUPERNOTE_Q5_MODULE_COMMAND": command,
              "SUPERNOTE_Q5_PYTHON": python,
              "SUPERNOTE_Q5_WHEEL": wheel,
              "SUPERNOTE_Q5_WHEEL_SHA256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "SUPERNOTE_Q5_SDIST": sdist,
              "SUPERNOTE_Q5_SDIST_SHA256": hashlib.sha256(sdist.read_bytes()).hexdigest(),
              "SUPERNOTE_Q5_RUNTIME_ROOT": (root / "npm/supernote-runtime").resolve(),
              "SUPERNOTE_GRADLE_COMMAND": shutil.which("gradle") or "gradle",
              "SUPERNOTE_Q5_COMBINED_EVIDENCE": Path(os.environ["RUNNER_TEMP"]) / "generator-acceptance.json",
              "SUPERNOTE_REQUIRE_INSTALLED_QUALIFICATION": "1",
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for name, value in values.items():
                  stream.write(f"{name}={value}\n")
          PY
      - name: Execute installed author and immutable-consumer acceptance
        shell: bash
        run: |
          python -m pytest -q \
            --junitxml="${{ runner.temp }}/generator-acceptance.xml" \
            tests/test_q5_installed_qualification.py \
            tests/test_q5_combined_installed_acceptance.py
          python ci/verify_command_result.py installed-verify \
            --junit="${{ runner.temp }}/generator-acceptance.xml" \
            --evidence="${{ runner.temp }}/generator-acceptance.json"
      - name: Retain generator-only success or failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generator-acceptance-${{ runner.os }}-cmake-${{ matrix.cmake }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/generator-acceptance.xml
            ${{ runner.temp }}/generator-acceptance.json
            ${{ runner.temp }}/generator-toolchain.json
          if-no-files-found: warn
          retention-days: 7
