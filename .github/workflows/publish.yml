name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release tools
        run: python -m pip install 'build>=1,<2' 'twine>=5,<7'
      - name: Verify release tag and reserve stable V2
        shell: bash
        run: |
          version="$(PYTHONPATH=src python -c 'from supernote_module_generator import __version__; print(__version__)')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version v${version}." >&2
            exit 1
          fi
          if [[ "${version}" == "2.0.0" ]]; then
            echo "Stable 2.0.0 is blocked until the V2 release gates are completed and this guard is deliberately removed." >&2
            exit 1
          fi
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Store release distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/supernote-module-generator/
    permissions:
      id-token: write
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish release distributions
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
