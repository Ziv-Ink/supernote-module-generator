[metadata]
name = supernote-module-generator
version = 1.0.0
description = Generate Kotlin/Java, JNI C/C++, and JSI modules for Supernote plugins
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
supernote_module_generator = templates/*

[options.entry_points]
console_scripts =
    supernote-module = supernote_module_generator.cli:main
