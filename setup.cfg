[metadata]
name = supernote-module-generator
version = attr: supernote_module_generator.__version__
description = Generate typed C/C++ and Kotlin/Java features for existing Supernote plugins
author = Ziv-Ink
author_email = einkatelier@gmail.com
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
url = https://github.com/Ziv-Ink/supernote-module-generator
project_urls =
    Issues = https://github.com/Ziv-Ink/supernote-module-generator/issues
    PyPI = https://pypi.org/project/supernote-module-generator/
    Source = https://github.com/Ziv-Ink/supernote-module-generator
keywords = android, code-generator, jni, jsi, react-native, supernote
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Software Development :: Code Generators

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = False

[options.packages.find]
where = src

[options.package_data]
supernote_module_generator =
    templates/*
    schemas/*.json

[options.entry_points]
console_scripts =
    supernote-module = supernote_module_generator.cli:main

[options.extras_require]
dev =
    build>=1,<2
    coverage[toml]>=7.6,<8
    jsonschema>=4,<5
    mypy>=1.11,<2
    pytest>=8,<9
    ruff>=0.9,<1
    setuptools>=58
    twine>=5,<7
    wheel

[coverage:run]
branch = True
relative_files = True
source = supernote_module_generator

[coverage:report]
fail_under = 82.03
precision = 2
show_missing = True
skip_covered = True
