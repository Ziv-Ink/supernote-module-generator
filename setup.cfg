[metadata]
name = supernote-module-generator
version = attr: supernote_module_generator.__version__
description = Generate typed C/C++ and Kotlin/Java features for existing Supernote plugins
author = Ziv-Ink
author_email = einkatelier@gmail.com
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
url = https://github.com/Ziv-Ink/supernote-module-generator
project_urls =
    Issues = https://github.com/Ziv-Ink/supernote-module-generator/issues
    PyPI = https://pypi.org/project/supernote-module-generator/
    Source = https://github.com/Ziv-Ink/supernote-module-generator
keywords = android, code-generator, jni, jsi, react-native, supernote
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Software Development :: Code Generators

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
supernote_module_generator = templates/*

[options.entry_points]
console_scripts =
    supernote-module = supernote_module_generator.cli:main

[options.extras_require]
dev =
    build>=1,<2
    pytest>=8,<9
    twine>=5,<7
